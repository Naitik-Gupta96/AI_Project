[project]
name = "ai-project"
version = "0.2.0"
description = "Intelligible Blackboard Architecture with Counterfactual Agents"
readme = "README.md"
authors = [{name = "Naitik Gupta", email = "guptanaitik1234@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The core (protocol, Blackboard, scheduler, agents, counterfactual layer,
# mock and Ollama/OpenAI-compatible providers) needs only the standard library.
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
hf = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
    "lm-format-enforcer>=0.10",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
bb = "ai_project.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_project.llm" = ["prompts/*.md", "prompts/*.json", "prompts/personas/*/*.md", "prompts/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/ai_project/cli.py" = ["T201"]  # the CLI prints by design
