[project]
name = "ai-project"
version = "0.1.0"
description = "Intelligible Blackboard Architecture with Counterfactual Agents"
readme = "README.md"
authors = [{name = "Naitik Gupta", email = "guptanaitik1234@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The core (Blackboard, agents, scheduler, counterfactual engine, experiments)
# uses only the standard library. The optional Ollama provider also uses only
# the standard library but needs a local Ollama server.
dependencies = []

[project.optional-dependencies]
ui = [
    "streamlit>=1.46",
    "pandas>=2.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "ai-project[ui]",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_project.llm" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
